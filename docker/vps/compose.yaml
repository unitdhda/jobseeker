services:
  jobseeker:
    build:
      context: .
      dockerfile: Dockerfile
    image: unitdhda/jobseeker:0.2.1
    restart: unless-stopped
    init: true
    env_file:
      - ./jobseeker.env
    environment:
      TELEGRAM_MODE: polling
      RUN_JOBS: "true"
      HH_BROWSER_DATA_PATH: /app/data/hh-browser
      JOBSEEKER_EXTENSIONS: /app/extensions
      AI_AUTH_FILE: /app/data/auth.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - jobseeker-data:/app/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=../seccomp-chromium.json
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - private

volumes:
  jobseeker-data:

networks:
  private:
    driver: bridge
