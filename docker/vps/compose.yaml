# All-in-one VPS deployment: the bot polls Telegram and runs its own cycle schedule in-process,
# scoring through the claude-cli sidecar instead of a metered API key.
#
# PREREQUISITE — this takes Telegram and scheduling ownership away from Cloud Run.
# Pause Cloud Scheduler and remove the Cloud Run webhook first; see docs/operations.md.
#
# Expected host layout:
#   ~/containers/jobseeker/      compose.yaml, .env, claude-creds/auth.json
#   ~/containers/claude-cli/     sidecar build context
#   ~/containers/jobseeker-src/  application source checkout
#
#   docker compose --env-file .env up -d --build
services:
  claude-cli:
    build:
      context: ../claude-cli
    image: claude-cli-service:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /home/claude:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
    environment:
      PORT: "8787"
      # Short-lived pi-style OAuth credential; the service refreshes it and writes the rotated token back,
      # so this mount must stay writable.
      CLAUDE_CREDENTIALS_FILE: /creds/auth.json
      CLAUDE_CLI_TOKEN: "${CLAUDE_CLI_TOKEN:?set CLAUDE_CLI_TOKEN}"
      CLAUDE_CLI_MAX_CONCURRENT: "${CLAUDE_CLI_MAX_CONCURRENT:-4}"
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    volumes:
      - ./claude-creds:/creds:rw
    # Reachable only from the bot on the internal network; no host port is published.
    expose:
      - "8787"
    networks:
      - jobseeker

  jobseeker:
    build:
      context: ../jobseeker-src
      target: worker
    image: jobseeker-vps:local
    restart: unless-stopped
    stop_grace_period: 70s
    init: true
    read_only: true
    depends_on:
      claude-cli:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:../jobseeker-src/docker/seccomp-chromium.json
    pids_limit: 512
    mem_limit: 2g
    cpus: 1.5
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=768m,mode=1777
    env_file:
      - .env
    environment:
      # Sole receiver and sole producer on this host. Both must be false everywhere else.
      TELEGRAM_MODE: "polling"
      RUN_JOBS: "true"
      RUN_INITIAL_CYCLE: "false"
      BACKGROUND_DELIVERY_ASYNC: "false"
      # Everything routes through the sidecar. The OpenAI Codex subscription is exhausted, which was failing
      # application generation for live users; Codex remains reachable by unsetting these.
      AI_MODEL: "${AI_MODEL:-claude-cli/claude-opus-5}"
      AI_THINKING_LEVEL: "${AI_THINKING_LEVEL:-high}"
      AI_SCORING_MODEL: "${AI_SCORING_MODEL:-claude-cli/claude-opus-5}"
      AI_SCORING_THINKING_LEVEL: "${AI_SCORING_THINKING_LEVEL:-medium}"
      CLAUDE_CLI_ENDPOINT: "http://claude-cli:8787"
      # A 2-vCPU host cannot sustain the Cloud Run concurrency settings.
      USER_WORKFLOW_CONCURRENCY: "${USER_WORKFLOW_CONCURRENCY:-2}"
      SCORE_AGENT_CONCURRENCY_MIN: "2"
      SCORE_AGENT_CONCURRENCY_MAX: "4"
      HH_BROWSER_DATA_PATH: /app/data/hh-browser
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TYPST_FONT_PATHS: /app/fonts
      POSTGRES_SSL: "require"
      PORT: "3000"
    command: ["bun", "dist/server.mjs"]
    volumes:
      - jobseeker-data:/app/data
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks:
      - jobseeker

volumes:
  jobseeker-data:

networks:
  jobseeker:
    name: jobseeker
