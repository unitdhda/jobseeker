services:
  jobseeker:
    build:
      context: .
    image: hh-jobseeker:local
    restart: unless-stopped
    stop_grace_period: 70s
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/seccomp-chromium.json
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    env_file:
      - .env
    environment:
      PORT: "3000"
      RUN_INITIAL_CYCLE: "${RUN_INITIAL_CYCLE:-true}"
      DATABASE_PATH: /app/data/jobseeker.db
      OPENAI_CODEX_AUTH_FILE: /app/auth/auth.json
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TYPST_FONT_PATHS: /app/fonts
    volumes:
      - jobseeker-data:/app/data
      - ./auth:/app/auth
      - ./fonts:/app/fonts:ro
      - ./model-cache:/app/data/models
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  jobseeker-data:
