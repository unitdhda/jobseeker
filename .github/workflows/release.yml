name: Release package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.3.14

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install extension development dependencies
        run: |
          bun install --cwd extensions/hh
          bun install --cwd extensions/claude-cli

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Pack application only
        id: pack
        working-directory: packages/app
        run: echo "tarball=$(npm pack --json | node -e \"let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))\")" >> "$GITHUB_OUTPUT"

      - name: Install tarball externally and run Node CLI help
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          smoke="$(mktemp -d)"
          trap 'rm -rf "$smoke"' EXIT
          cd "$smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/packages/app/$TARBALL"
          npx --no-install jobseeker help

      - name: Publish with provenance
        working-directory: packages/app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
